apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: jaeger-v2
spec:
  dependsOn: []
  prune: true
  interval: 10m
  retryInterval: 3m
  path: observability/packages/jaeger-v2/manifests/jaeger
  sourceRef:
    kind: GitRepository
    name: wac-manifests
  postBuild:
    substituteFrom:    []
  targetNamespace: observability
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: jaeger-fea
spec:
  dependsOn: 
    - name: jaeger-v2
  prune: true
  interval: 10m
  retryInterval: 3m
  path: observability/packages/jaeger-v2/manifests/fea
  sourceRef:
    kind: GitRepository
    name: wac-manifests
  postBuild:
    substituteFrom:    []
  targetNamespace: observability
