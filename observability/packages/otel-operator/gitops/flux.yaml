apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: otel-operator
spec:
  targetNamespace: opentelemetry-system
  dependsOn: []
  prune: true
  interval: 10m
  retryInterval: 3m
  path: observability/packages/otel-operator/manifests
  sourceRef:
    kind: GitRepository
    name: wac-manifests
  postBuild:
    substituteFrom:  []
    
