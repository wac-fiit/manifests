apiVersion: opentelemetry.io/v1beta1 
kind: OpenTelemetryCollector
metadata:
  name: otel
  namespace: observability
spec:
  mode: daemonset
  #image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:latest
  serviceAccount: otelcol-k8s-log-sa
  volumes:
    - name: varlogpods
      hostPath:
        path: /var/log/pods
    - name: varlogcontainers
      hostPath:
        path: /var/log/containers
    - name: varlibdockercontainers
      hostPath:
        path: /var/lib/docker/containers

  volumeMounts:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true
    - name: varlogcontainers
      mountPath: /var/log/containers
      readOnly: true
    - name: varlibdockercontainers
      mountPath: /var/lib/docker/containers
      readOnly: true

  env:
    - name: K8S_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: K8S_NODE_IP
      valueFrom:
        fieldRef:
          fieldPath: status.hostIP
  config: 
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      kubeletstats:
        collection_interval: 20s
        auth_type: "serviceAccount"
        endpoint: "https://$${env:K8S_NODE_NAME}:10250"
        insecure_skip_verify: true
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        exclude:
          - /var/log/pods/observability_otel*/*/*.log
        include_file_path: true
        start_at: end
        operators:
          - type: container
    exporters:
        nop: {}
    processors:
        transform:
          error_mode: ignore
          log_statements:
            - context: log
              statements:
                - merge_maps(attributes, ParseJSON(body), "upsert")
        batch/logs:
          send_batch_size: 8192
          timeout: 2s
        batch/metrics:
          send_batch_size: 8192
          timeout: 1s
        batch/traces:
          send_batch_size: 8192
          timeout: 5s
        k8sattributes:
          auth_type: "serviceAccount"
          passthrough: false
          extract:
            metadata:
              - k8s.pod.name
              - k8s.pod.uid
              - k8s.deployment.name
              - k8s.namespace.name
              - k8s.node.name
              - k8s.container.name
          pod_association:
            - sources:
                - from: resource_attribute
                  name: k8s.pod.uid
    service:
        pipelines:
          traces:
            receivers: [otlp]
            processors: [batch/traces]
            exporters: [nop]
          metrics:
            receivers: [otlp, kubeletstats]
            processors: [batch/metrics]
            exporters: [nop]
          logs:
            receivers: [otlp, filelog]
            processors:
            - k8sattributes
            - batch/logs
            exporters: [nop]
