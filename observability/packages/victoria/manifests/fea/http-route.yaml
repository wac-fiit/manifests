apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: victoria
spec:
  parentRefs:
    - name: wac-hospital-gateway
      namespace: wac-hospital
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /victoria/logs
      backendRefs:
        - group: ""
          kind: Service
          name: victoria
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /victoria/metrics
      backendRefs:
        - group: ""
          kind: Service
          name: victoria
          port: 81
    - matches:
        - path:
            type: PathPrefix
            value: /victoria/traces
      backendRefs:
        - group: ""
          kind: Service
          name: victoria
          port: 82
