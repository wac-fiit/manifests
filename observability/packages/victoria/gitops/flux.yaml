apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: victoria
spec:
  dependsOn: []
  prune: true
  interval: 10m
  retryInterval: 3m
  path: observability/packages/victoria/manifests/victoria
  sourceRef:
    kind: GitRepository
    name: gitops-repo
  postBuild:
    substituteFrom:    []
  targetNamespace: observability
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: victoria-fea
spec:
  dependsOn: 
    - name: victoria
    - name: gateway-api
    - name: polyfea-controller
  prune: true
  interval: 10m
  retryInterval: 3m
  path: observability/packages/victoria/manifests/fea
  sourceRef:
    kind: GitRepository
    name: gitops-repo
  postBuild:
    substituteFrom:    []
  targetNamespace: observability
